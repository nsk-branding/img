<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VirtualCon Gallery</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <section class="bento-gallery">
        <div class="bento-item large">
            <img src="IMG/VirtualCon/ezgif-5349db462103d0.gif" alt="VirtualCon Outfit 1">
            <button class="copy-btn" onclick="copyURL('IMG/VirtualCon/ezgif-5349db462103d0.gif')">📋</button>
        </div>
        <div class="bento-item tall">
            <img src="IMG/VirtualCon/ezgif-501965a8a2ee5f.gif" alt="VirtualCon Outfit 2">
            <button class="copy-btn" onclick="copyURL('IMG/VirtualCon/ezgif-501965a8a2ee5f.gif')">📋</button>
        </div>
        <div class="bento-item">
            <img src="IMG/VirtualCon/f2024.gif" alt="VirtualCon 2024 Female">
            <button class="copy-btn" onclick="copyURL('IMG/VirtualCon/f2024.gif')">📋</button>
        </div>
        <div class="bento-item wide">
            <img src="IMG/VirtualCon/m2024.gif" alt="VirtualCon 2024 Male">
            <button class="copy-btn" onclick="copyURL('IMG/VirtualCon/m2024.gif')">📋</button>
        </div>
    </section>

    <script>
        function copyURL(filename) {
            const fullURL = `${window.location.origin}/${filename}`;
            navigator.clipboard.writeText(fullURL)
                .then(() => {
                    alert('✅ URL copiada:\n' + fullURL);
                })
                .catch(err => {
                    console.error('Error al copiar:', err);
                });
        }
    </script>
</body>

</html>
